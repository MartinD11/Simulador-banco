server:
  port: 8082

spring:
  application:
    name: ms-transacciones
  datasource:
    url: jdbc:postgresql://localhost:5433/banco_transacciones?timezone=America/Argentina/Buenos_Aires
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.cloud.openfeign: DEBUG
    feign: DEBUG
    com.tubanco.mstransacciones: DEBUG