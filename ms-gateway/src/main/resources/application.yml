server:
  port: 8080

spring:
  application:
    name: ms-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      default-filters:
        - RemoveRequestHeader=X-Llamada-Interna

      routes:
        # 1. Rutas PÚBLICAS (Login y Autenticación)
        - id: ms-usuarios-auth
          uri: lb://MS-USUARIOS
          predicates:
            - Path=/api/auth/**

        # 2. Ruta PÚBLICA (Solo para Registrarse / POST)
        - id: ms-usuarios-registro
          uri: lb://MS-USUARIOS
          predicates:
            - Path=/api/usuarios
            - Method=POST

        # 3. Rutas PROTEGIDAS de Usuarios (Ver perfil, editar, eliminar)
        - id: ms-usuarios-protegido
          uri: lb://MS-USUARIOS
          predicates:
            - Path=/api/usuarios/**
          filters:
            - AuthFilter

        # 4. Rutas PROTEGIDAS de Cuentas
        - id: ms-cuentas
          uri: lb://MS-CUENTAS
          predicates:
            - Path=/api/cuentas/**
          filters:
            - AuthFilter

        # 5. Rutas PROTEGIDAS de Transacciones
        - id: ms-transacciones
          uri: lb://MS-TRANSACCIONES
          predicates:
            - Path=/api/transacciones/**
          filters:
            - AuthFilter

# Configuración de JWT
jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: ${JWT_EXPIRATION_TIME:86400000}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/