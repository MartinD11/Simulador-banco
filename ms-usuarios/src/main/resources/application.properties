server.port=8083

spring.application.name=ms-usuarios
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:postgresql://localhost:5433/banco_usuarios?timezone=America/Argentina/Buenos_Aires
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
jwt.secret=EstaEsUnaClaveSecretaSuperSeguraParaTodoElSistemaBanco123456789
jwt.expiration=3600000
# Configuracion de Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379