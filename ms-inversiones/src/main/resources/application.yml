server:
  port: 8085

spring:
  application:
    name: ms-inversiones
  datasource:
    url: jdbc:postgresql://localhost:5433/banco_inversiones?options=-c%20TimeZone%3DUTC
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
dolar:
  api:
    base-url: https://dolarapi.com/v1
plazo-fijo:
  tna: 0.35