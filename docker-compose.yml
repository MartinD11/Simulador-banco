version: '3.8'

services:
  postgres-db:
    image: postgres:15
    container_name: postgres-banco
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: banco_cuentas
      TZ: America/Buenos_Aires
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pg_data: