version: '3.8'

services:
  postgres-db:
    image: postgres:16
    container_name: postgres-banco
    command: -c timezone=America/Argentina/Buenos_Aires
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: banco_cuentas
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
  redis:
    image: redis:alpine
    container_name: redis-banco
    ports:
      - "6379:6379"
    restart: always
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-banco
    ports:
      - "5672:5672"   # Puerto interno por donde se comunican los microservicios Java
      - "15672:15672" # Puerto web para que vos entres a ver la interfaz gráfica
    restart: always
volumes:
  pg_data: