version: '3.8'

services:
  postgres-db:
    image: postgres:16
    container_name: postgres-banco
    command: -c timezone=America/Argentina/Buenos_Aires
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: banco_cuentas
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pg_data: